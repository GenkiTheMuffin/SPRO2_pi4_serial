# printer.cfg
# BTT SKR Mini E3 V1.2 on Neptune 3 Plus frame
# Lego Building Machine — XYZ only (gripper/rotation to be added later)
#
# Before starting:
# 1. Find your serial ID: ls /dev/serial/by-id/
# 2. Replace the serial value below with your actual ID
# 3. Calibrate probe z_offset with PROBE_CALIBRATE after first boot
# 4. If any axis moves the wrong direction, add/remove ! on its dir_pin


[include mainsail.cfg]
[include macros.cfg]

# ── MCU ──────────────────────────────────────────────────────────────────────

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_31FFD7054242363129760557-if00

[mcu host]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1500
max_z_velocity: 5
max_z_accel: 100

# ── X AXIS ───────────────────────────────────────────────────────────────────

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 320
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PB15
run_current: 0.450
stealthchop_threshold: 999999

# ── Y AXIS ───────────────────────────────────────────────────────────────────

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 320
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC6
run_current: 0.450
stealthchop_threshold: 999999

# ── Z AXIS ───────────────────────────────────────────────────────────────────

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -20
position_max: 400
homing_speed: 20
second_homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PC10
run_current: 0.450
stealthchop_threshold: 999999

# ────────────────────────── #
# Rotation stepper (NEMA 14) #
# ────────────────────────── #

[manual_stepper stepper_e]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 360
velocity: 20
accel: 200
endstop_pin: ^host:gpio20   # ^ = pull-up, ! = invert (active-low sensor)

[tmc2209 manual_stepper stepper_e]
uart_pin: PC11
run_current: 0.450
hold_current: 0.100
sense_resistor: 0.110
stealthchop_threshold: 999999


# ── PROBE ─────────────────────────────────────────────────────────────────────
# NPN inductive probe powered externally from 24V PSU
# Signal wire to Z-STOP pin
# ^ enables internal pull-up required for NPN open-collector output
# Adjust x_offset and y_offset to match probe position relative to toolhead

[probe]
pin: ^PC2
x_offset: 0
y_offset: 0
z_offset: 0        # run PROBE_CALIBRATE to set this
speed: 10.0
samples: 2
sample_retract_dist: 3.0

#[safe_z_home]
#home_xy_position: 160, 160  # center of bed - adjust if needed
#speed: 50
#z_hop: 10
#z_hop_speed: 5

# ── FANS ──────────────────────────────────────────────────────────────────────

[fan]
pin: PA8

# ── MISC ──────────────────────────────────────────────────────────────────────

[force_move]
enable_force_move: True

# Required for SKR Mini E3 V1.2 USB communication
[static_digital_output usb_pullup_enable]
pins: !PC13

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PB6,  EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7,  EXP1_10=<5V>