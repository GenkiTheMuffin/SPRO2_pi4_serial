# ═══════════════════════════════════════════════════════════════════════════
# printer.cfg — Jaw control macros
# Add this section to your existing printer.cfg
# ═══════════════════════════════════════════════════════════════════════════

# ── Shell command wrappers ──────────────────────────────────────────────────
# Requires the shell_command Klipper extension (install via KIAUH)

[gcode_shell_command serial_send]
command: /usr/local/bin/send_serial
timeout: 5.0
verbose: False


# ── State variable holder ───────────────────────────────────────────────────
# Holds whether the Pico has confirmed the jaw action is complete.
# Not called directly — just stores the variable.

[gcode_macro JAW_STATE]
variable_ready: False
gcode:
  # intentionally empty


# ── Public macros — use these in your G-code ───────────────────────────────

[gcode_macro OPEN_JAW]
description: Send OPEN_JAW to Pico 2 and block until jaw is fully open
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=False
  RUN_SHELL_COMMAND CMD=serial_send PARAMS="OPEN_JAW"
  WAIT_FOR_JAW


[gcode_macro CLOSE_JAW]
description: Send CLOSE_JAW to Pico 2 and block until jaw is fully closed
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=False
  RUN_SHELL_COMMAND CMD=serial_send PARAMS="CLOSE_JAW"
  WAIT_FOR_JAW


# ── Internal wait loop ──────────────────────────────────────────────────────
# Polls JAW_STATE.ready every 100 ms.
# Times out after 10 seconds (100 tries × 100 ms) and raises an error.

[gcode_macro WAIT_FOR_JAW]
description: Block until Pico 2 confirms jaw action is complete
gcode:
  {% set max_tries = 100 %}
  {% set tries = params.TRIES|default(0)|int %}
  {% if not printer["gcode_macro JAW_STATE"].ready %}
    {% if tries >= max_tries %}
      { action_raise_error("Jaw response timeout — no confirmation from Pico 2") }
    {% else %}
      G4 P100
      WAIT_FOR_JAW TRIES={ tries + 1 }
    {% endif %}
  {% endif %}


# ── Response macros — called by serial_listener when Pico replies ───────────

[gcode_macro JAW_FULLY_OPEN]
description: Triggered by serial_listener when Pico confirms jaw is open
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=True
  RESPOND MSG="Jaw is fully open"


[gcode_macro JAW_FULLY_CLOSED]
description: Triggered by serial_listener when Pico confirms jaw is closed
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=True
  RESPOND MSG="Jaw is fully closed"
