# ── Shell command wrappers ──────────────────────────────────────────────────
# Requires the shell_command Klipper extension (install via KIAUH)

[gcode_shell_command serial_send]
command: /usr/local/bin/send_serial
timeout: 5.0
verbose: False


# ── State variable holder ───────────────────────────────────────────────────
# Holds whether the Pico has confirmed the jaw action is complete.
# Not called directly — just stores the variable.

[gcode_macro JAW_STATE]
variable_ready: False
gcode:
  # intentionally empty


# ── Public macros — use these in your G-code ───────────────────────────────

[gcode_macro OPEN_JAW]
description: Send OPEN_JAW to Pico 2 and block until jaw is fully open
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=False
  RUN_SHELL_COMMAND CMD=serial_send PARAMS="OPEN_JAW"
  WAIT_FOR_JAW


[gcode_macro CLOSE_JAW]
description: Send CLOSE_JAW to Pico 2 and block until jaw is fully closed
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=False
  RUN_SHELL_COMMAND CMD=serial_send PARAMS="CLOSE_JAW"
  WAIT_FOR_JAW


# ── Internal wait loop ──────────────────────────────────────────────────────
# Polls JAW_STATE.ready every 100 ms.
# Times out after 10 seconds (100 tries × 100 ms) and raises an error.
[delayed_gcode wait_for_jaw_check]
gcode:
    {% set max_tries = 100 %}
    {% set tries = printer["gcode_macro WAIT_FOR_JAW"].tries %}
    {% if not printer["gcode_macro JAW_STATE"].ready %}
        {% if tries >= max_tries %}
            { action_raise_error("Jaw response timeout — no confirmation from Pico 2") }
        {% else %}
            SET_GCODE_VARIABLE MACRO=WAIT_FOR_JAW VARIABLE=tries VALUE={ tries + 1 }
            UPDATE_DELAYED_GCODE ID=wait_for_jaw_check DURATION=0.1
        {% endif %}
    {% endif %}

[gcode_macro WAIT_FOR_JAW]
description: Block until Pico 2 confirms jaw action is complete
variable_tries: 0
gcode:
    SET_GCODE_VARIABLE MACRO=WAIT_FOR_JAW VARIABLE=tries VALUE=0
    UPDATE_DELAYED_GCODE ID=wait_for_jaw_check DURATION=0.1


# ── Response macros — called by serial_listener when Pico replies ───────────

[gcode_macro JAW_FULLY_OPEN]
description: Triggered by serial_listener when Pico confirms jaw is open
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=True
  RESPOND MSG="Jaw is fully open"


[gcode_macro JAW_FULLY_CLOSED]
description: Triggered by serial_listener when Pico confirms jaw is closed
gcode:
  SET_GCODE_VARIABLE MACRO=JAW_STATE VARIABLE=ready VALUE=True
  RESPOND MSG="Jaw is fully closed"

[gcode_macro ROTATE_HOME]
gcode:
    {% if "x" not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if "z" in printer.toolhead.homed_axes %}
      G0 Z25 F6000
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
      G0 X60 F6000
    {% endif %}
    

    MANUAL_STEPPER STEPPER=stepper_e SET_POSITION=0 ENABLE=1
    MANUAL_STEPPER STEPPER=stepper_e SPEED=20 MOVE=10
    MANUAL_STEPPER STEPPER=stepper_e SPEED=25 MOVE=-720 STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=stepper_e SET_POSITION=0
    MANUAL_STEPPER STEPPER=stepper_e SPEED=20 MOVE=10
    MANUAL_STEPPER STEPPER=stepper_e SPEED=5 MOVE=-20 STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=stepper_e SET_POSITION=0
    M117 Rotation homed

[gcode_macro ROTATE]
description: Rotate gripper to an absolute angle (0–360 degrees)
gcode:
    {% set angle = params.ANGLE|float %}
    {% if angle < 0 or angle > 90 %}
        {action_respond_info("ROTATE: Angle must be between 0 and 90")}
    {% else %}
        MANUAL_STEPPER STEPPER=stepper_e ENABLE=1 MOVE={angle} SPEED=20
    {% endif %}


[homing_override]
axes: xyz
gcode:
    {% set do_x = 'X' in params %}
    {% set do_y = 'Y' in params %}
    {% set do_z = 'Z' in params %}
    {% set do_all = not do_x and not do_y and not do_z %}

    FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=5

    {% if do_all or do_x %}
        G28 X
    {% endif %}

    {% if do_all or do_y %}
        G28 Y
    {% endif %}

    {% if do_all or do_z %}
        ROTATE_HOME
        G0 X45 Y18 F4500
        G28 Z
    {% endif %}

[gcode_macro PICK_UP_BRICK]
description: Move to pick up a Lego brick at X316 Y24 Z-2 E0
gcode:
    # Safety checks
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Open gripper before moving anywhere near the brick
    #OPEN_JAW

    # Rotate to 0 degrees and move XY to above the brick at a safe Z
    ROTATE ANGLE=0
    G0 X315 Y24 Z20 F6000

    # Slow descent onto the brick with jaw already open
    G0 Z-2 F200

    # Grab it
    #CLOSE_JAW

[gcode_macro STORE_BRICK]
description: Move to store a Lego brick at X316 Y24 Z-2 E0
gcode:
    # Safety checks
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("STORE_BRICK: Home all axes and pick up brick first") }
    {% endif %}

    # Rotate to 0 degrees and move XY to above the brick at a safe Z
    ROTATE ANGLE=0
    G0 X317 Y288 Z150 F6000

    # Slow descent onto the brick with jaw already open
    G0 Z122 F200

    # release it
    #OPEN_JAW


